<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BIP30</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0a;
      --accent: #c8f135;
      --text: #f0ede6;
      --muted: #444;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 10;
    }

    .blob {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,241,53,0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 2rem;
      width: 100%;
      max-width: 900px;
    }

    .tag {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(200,241,53,0.3);
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 100px;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.8s ease both;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(4rem, 15vw, 11rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.03em;
      animation: fadeUp 0.8s 0.15s ease both;
    }

    h1 .hola { display: block; color: var(--text); }

    h1 .brand {
      display: block;
      color: var(--accent);
      position: relative;
    }

    h1 .brand::after {
      content: 'BIP30';
      position: absolute;
      left: 0; right: 0;
      color: transparent;
      -webkit-text-stroke: 1px rgba(200,241,53,0.2);
      transform: translate(4px, 4px);
      z-index: -1;
    }

    .sub {
      margin-top: 2rem;
      font-size: 1rem;
      letter-spacing: 0.05em;
      animation: fadeUp 0.8s 0.3s ease both;
    }

    .sub a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(200,241,53,0.3);
      transition: border-color 0.2s ease;
    }

    .sub a:hover {
      border-color: var(--accent);
    }

    .line {
      width: 60px;
      height: 2px;
      background: var(--accent);
      margin: 2.5rem auto;
      animation: expandLine 1s 0.6s ease both;
      transform-origin: center;
    }

    /* VIDEO */
    .video-wrapper {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(200,241,53,0.2);
      box-shadow: 0 0 60px rgba(200,241,53,0.08);
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      animation: fadeUp 0.8s 0.5s ease both;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    @keyframes expandLine {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="blob"></div>
  <div class="container">
    <span class="tag">Bienvenido</span>
    <h1>
      <span class="hola">Hola,</span>
      <span class="brand">BIP30</span>
    </h1>
    <p class="sub">
      <a href="https://bip30.blogspot.com/" target="_blank" rel="noopener">
        Click aquí para mas información
      </a>
    </p>
    <div class="line"></div>

    <div class="video-wrapper">
      <iframe
        src="https://www.youtube.com/embed/Fi1uDlwJrdY?autoplay=0&rel=0&modestbranding=1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </div>
</body>
</html>
